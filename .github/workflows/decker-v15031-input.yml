name: Decker v1.50.31 source hash and native-input gate
on:
  pull_request:
    paths:
      - 'addons/decker/decker.lua'
      - 'tests/regression.lua'
      - '.github/workflows/decker-v15031-input.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtimes
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 luajit
      - name: Verify LuaJIT and host regressions
        run: |
          luajit -b addons/decker/decker.lua /tmp/decker.ljbc
          python3 tests/run_lua54.py
          python3 tests/run_luajit.py
      - name: Print immutable source checksum
        run: sha256sum addons/decker/decker.lua
