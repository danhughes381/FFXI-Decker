name: Import v1.47 release source
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/import-release-source.yml'
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import Decker from published v1.47 asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.47 --pattern 'Decker_v1.47_Mutant_X.zip' --dir /tmp/decker-release
          unzip -l /tmp/decker-release/Decker_v1.47_Mutant_X.zip
          mkdir -p addons/decker
          unzip -p /tmp/decker-release/Decker_v1.47_Mutant_X.zip addons/decker/decker.lua > addons/decker/decker.lua
          test -s addons/decker/decker.lua
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add addons/decker/decker.lua
          if ! git diff --cached --quiet; then
            git commit -m "source: publish Decker v1.47 Lua from release asset"
            git push
          fi
      - name: Update release description
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.47 --title 'Decker v1.47 — by Mutant X' --notes-file RELEASE_NOTES.md --prerelease
